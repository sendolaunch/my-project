<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>OSSARA — Hold the breach. Loot the dead.</title>
  <link rel="stylesheet" href="./src/ui/style.css" />
  <!--
    Three.js is pulled from a CDN via an import map so the slice runs with zero
    build step — serve the folder with any static server and open it. When we
    move to a bundler (Vite) for the co-op WebSocket work (§9.4), this import
    map is the only thing that changes; all `import 'three'` statements stay.
  -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="game-root">
    <canvas id="game-canvas"></canvas>
    <div id="ui-root"></div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
