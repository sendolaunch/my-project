<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>OSSARA — Hold the breach. Loot the dead.</title>
  <link rel="stylesheet" href="./src/ui/style.css" />
  <!--
    Three.js is vendored locally (vendor/three) and wired through an import map,
    so the game is fully self-contained — no runtime CDN dependency, no always-on
    backend. This is what lets the whole client deploy as static files on Vercel.
    When we move to a bundler (Vite) later, this import map is the only thing that
    changes; every `import 'three'` statement stays.
  -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="game-root">
    <canvas id="game-canvas"></canvas>
    <div id="ui-root"></div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
